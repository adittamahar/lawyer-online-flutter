
name: Build Lawyer Online APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project package
        run: |
          unzip -q lawyer_online_flutter_mobile_package.zip -d package_contents
          unzip -q package_contents/lawyer-online-flutter-project.zip -d project_files
          cp -R project_files/. .

      - name: Create Android platform
        run: flutter create --platforms=android --org com.lawyeronline --project-name lawyer_online .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lawyer-online-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
